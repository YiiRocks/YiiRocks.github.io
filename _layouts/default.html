<!DOCTYPE html>
<html class="h-100" lang="en">
    <head>
        <meta http-equiv="content-type" content="text/html; charset=utf-8">
        <title>{{ page.title }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="author" content="Mister 42">
{% if page.pkgId %}
        <meta name="description" content="{{ site.data.projects[page.pkgId].description | strip }}">
{% else %}
        <meta name="description" content="The missing pieces for your Yii Framework projects, crafted by Mr. 42.">
{% endif %}
        <meta name="color-scheme" content="light dark">
        <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)">
        <link rel="icon" type="image/svg+xml" href="/assets/images/logo.svg">
        <link rel="alternate icon" href="/assets/images/favicon.ico">
        <link rel="apple-touch-icon" href="/assets/images/logo-180.png">
        <link href="//cdn.jsdelivr.net/npm/bootstrap/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="//cdn.jsdelivr.net/npm/bootstrap-icons@1/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="//cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github-dark-dimmed.min.css">
        <link rel="stylesheet" href="/assets/css/site.css">
        <script>
            document.documentElement.dataset.bsTheme=localStorage.theme||(window.matchMedia?.("(prefers-color-scheme:light)")?.matches?"light":"dark");
        </script>
    </head>
    <body class="d-flex flex-column h-100">
        <div class="site-nav">
            <div class="site-nav__inner d-flex align-items-center justify-content-between gap-4">
                {% if page.url != "/" %}<a href="/" class="site-nav__brand d-flex align-items-center gap-2">{% else %}<span class="site-nav__brand d-flex align-items-center gap-2">{% endif %}
                    <span class="site-nav__logo d-flex align-items-center justify-content-center flex-shrink-0"><img src="/assets/images/logo.svg" alt="Yii.Rocks"></span>
                    <span class="site-nav__wordmark">Yii<span class="site-nav__wordmark-accent">.Rocks</span></span>
                {% if page.url != "/" %}</a>{% else %}</span>{% endif %}
                <div class="site-nav__links d-flex align-items-center gap-4 flex-wrap">
{% if page.pkgId %}
                    <a href="/#packages" class="link-body-emphasis link-underline-opacity-0">All packages</a>
                    <a href="https://github.com/YiiRocks/{{ site.data.projects[page.pkgId].repo }}" target="_blank" rel="noopener" class="link-body-emphasis link-underline-opacity-0">GitHub</a>
{% else %}
                    <a href="/#packages" class="link-body-emphasis link-underline-opacity-0">Packages</a>
                    <a href="https://github.com/YiiRocks/" target="_blank" rel="noopener" class="link-body-emphasis link-underline-opacity-0">GitHub</a>
{% endif %}
                    <a href="https://www.mr42.me/" target="_blank" rel="noopener" class="link-body-emphasis link-underline-opacity-0">Mr. 42</a>
                    <button type="button" class="theme-toggle" id="themeToggle" title="Toggle dark mode" aria-label="Toggle dark mode">
                        <i class="bi-moon-fill theme-toggle__dark"></i>
                        <i class="bi-sun-fill theme-toggle__light"></i>
                    </button>
                </div>
            </div>
        </div>
        <main class="flex-shrink-0">
            {{ content }}
        </main>
        <footer class="site-footer mt-auto">
            <div class="site-footer__inner d-flex align-items-center justify-content-between flex-wrap gap-4">
                <span class="text-body-secondary fs-sm">Yii.Rocks &mdash; crafted by Mr. 42</span>
                <div class="d-flex align-items-center gap-4">
                    <a href="https://github.com/YiiRocks/" target="_blank" rel="noopener" title="YiiRocks on GitHub" class="link-body-emphasis link-underline-opacity-0 fs-sm">GitHub</a>
                    <a href="https://www.mr42.me/" target="_blank" rel="noopener" title="Visit Mr.42" class="link-body-emphasis link-underline-opacity-0 fs-sm">mr42.me</a>
                </div>
            </div>
        </footer>
        <button type="button" class="scroll-top" id="scrollTop" title="Scroll to top" aria-label="Scroll to top"><i class="bi-arrow-up"></i></button>
        <script src="//cdn.jsdelivr.net/npm/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
        <script src="//cdn.jsdelivr.net/gh/highlightjs/cdn-release/build/highlight.min.js"></script>
        <script src="//cdn.jsdelivr.net/npm/lozad/dist/lozad.min.js"></script>
        <script src="/assets/js/site.js"></script>
    </body>
</html>
