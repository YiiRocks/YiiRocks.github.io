---
layout: default
title: Yii.Rocks
---

<p class="lead text-center mb-4">PHP packages for the Yii Framework, crafted by Mr. 42.</p>

<div class="accordion bg-transparent" id="accordion">
{% for item in site.data.projects %}
{% assign key = item[0] %}
{% assign p = item[1] %}
    <div class="accordion-item">
        <h2 class="accordion-header" id="{{ p.head_id }}">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#{{ p.collapse_id }}" aria-expanded="false" aria-controls="{{ p.collapse_id }}">
                <span class="d-flex justify-content-between align-items-center flex-grow-1">
                    <span>{{ p.name }}</span>
                    {% if p.tagline %}<small class="text-muted fw-normal me-3">{{ p.tagline }}</small>{% endif %}
                </span>
            </button>
        </h2>
        <div id="{{ p.collapse_id }}" class="accordion-collapse collapse" aria-labelledby="{{ p.head_id }}" data-bs-parent="#accordion">
            <div class="accordion-body">
                {{ p.body }}
            </div>
            {% include footer.html project=key %}
        </div>
    </div>
{% endfor %}
</div>
