{% assign pkg = site.data.projects[include.pkgId] %}
    <h2 class="doc-eyebrow" id="support">Support</h2>
    <div class="doc-support-row d-flex align-items-center gap-3 flex-wrap">
        <button type="button" class="copy-btn copy-btn--inline" data-clipboard="composer require {{ pkg.package }}">composer require {{ pkg.package }}</button>
        <a href="https://github.com/YiiRocks/{{ pkg.repo }}/issues" target="_blank" rel="noopener" class="docs-entry__link docs-entry__link--docs">Create an issue &rarr;</a>
    </div>
    <div class="docs-entry__badges d-flex gap-2 flex-wrap ms-auto justify-content-end">
        {% include package_badges.html project=include.pkgId %}
    </div>
