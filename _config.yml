title: Yii.Rocks
description: The missing pieces for your Yii 3 projects.
url: "https://www.yii.rocks"
logo: /assets/images/logo-180.png
author: Mr. 42

syntax_highlighter: rouge
rouge_options:
  formatter: html

plugins:
    - jekyll-redirect-from
    - jekyll-seo-tag
    - jekyll-sitemap

sass:
    style: compressed

permalink: /:path/

collections:
  packages:
    output: true
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: default