toast-bootstrap5:
  name: Toast Bootstrap5
  tagline: Bootstrap 5 toast notifications from flash messages
  tint: "#fff1e0"
  logo: /assets/icons/toast.svg
  package: yiirocks/toast-bootstrap5
  repo: toast-bootstrap5
  branch: main
  workflow: build.yml
  docsUrl: /toast-bootstrap5/
  description: >
    Renders Bootstrap 5 toast notifications from your Yii Framework 3
    application's session flash messages. Queue a message from a
    controller, render $toast in your layout - no manual partials, no
    bundled JS asset.
  features:
    - label: Flash-backed queue
      detail: FlashToastInterface::add(ToastType, string) queues success/error/warning/info messages onto the session flash; multiple messages of the same type stack as separate toasts
    - label: Zero-config rendering
      detail: $toast is injected into every web view via the config-plugin, and its render() returns nothing at all when no messages are pending
    - label: Per-type styling
      detail: Each type maps to a Bootstrap 5 text-bg-* color with the correct alert role/aria-live and close-button contrast
    - label: Configurable auto-dismiss
      detail: Per-type delay in milliseconds, or null to require manual dismissal - the default for error, so it isn't lost to a timer
    - label: Optional icons
      detail: Bootstrap Icon per type via the optional yiirocks/svg-inline-bootstrap sibling, rendering silently without one when it isn't installed
    - label: Bootstrap's own JS
      detail: Registers a small show-script through the view (at end of body, after Bootstrap's bundle regardless of load order) that calls bootstrap.Toast's own API - the only JS this package ships
  usage: |-
    use YiiRocks\ToastBootstrap5\ToastType;

    // queue from a controller (inject FlashToastInterface)
    $this->toast->add(ToastType::SUCCESS, 'Changes saved.');

    // render once in your layout, passing the current view
    echo $toast->render($this);
  options:
    - name: delay
      type: array
      default: "<code>['success' =&gt; 4000, 'error' =&gt; null, 'warning' =&gt; 6000, 'info' =&gt; 4000]</code>"
      desc: Milliseconds before a toast auto-hides, keyed by type; null leaves it up until dismissed manually, the default for error.
    - name: icons
      type: array
      default: "<code>['success' =&gt; 'check-circle-fill', 'error' =&gt; 'exclamation-octagon-fill', 'warning' =&gt; 'exclamation-triangle-fill', 'info' =&gt; 'info-circle-fill']</code>"
      desc: Bootstrap Icon name keyed by type (requires yiirocks/svg-inline-bootstrap; renders without an icon if it is not installed); null disables that type's icon.
    - name: position
      type: string
      default: "<code>'top-0 end-0'</code>"
      desc: Space-separated Bootstrap position utility classes for the toast container.
  exampleHeading: Example
  examples:
    - |-
      use YiiRocks\ToastBootstrap5\ToastType;

      $this->toast->add(ToastType::ERROR, 'Something went wrong.');

voyti:
  name: Voyti
  tagline: User management, authentication & authorization
  tint: "#eef4ff"
  logo: /assets/icons/voyti.svg
  featured: true
  package: yiirocks/voyti
  repo: voyti
  branch: main
  workflow: build.yml
  cli: true
  docsUrl: /voyti/
  description: >
    Provides highly customizable user management, authentication, and
    authorization for your Yii Framework 3 applications.
  sections:
    - slug: requirements
      title: Requirements
    - slug: quick-start
      title: Quick Start
    - slug: config
      title: Configuration
    - slug: social
      title: Social Auth
    - slug: console
      title: Console
    - slug: middleware
      title: Middleware
    - slug: rbac
      title: RBAC
    - slug: routes
      title: Routes
    - slug: events
      title: Events
    - slug: cookbook
      title: Cookbook
  features:
    - label: User management
      detail: Registration, email confirmation, login/logout with remember-me, password recovery, password expiration
    - label: Profile management
      detail: User profiles with gravatar, timezone, bio, and a personal website link
    - label: Social authentication
      detail: OAuth2 login via Google, GitHub, Facebook, and more
    - label: Two-factor authentication
      detail: TOTP (authenticator app) with QR code provisioning and email 2FA, with enforced-per-permission support, plus one-time backup codes for account recovery
    - label: RBAC Management
      detail: Full admin UI for roles, permissions, and rules with parent-child hierarchy, assignment management, and filtering
    - label: Identity switching
      detail: Admins can temporarily switch into another user's identity for support or debugging, then restore their own session with one click
    - label: Session management
      detail: Session tracking and termination
    - label: GDPR compliance
      detail: Consent management, data export, anonymized deletion with admin notification
    - label: Password policies
      detail: Minimum complexity requirements, max age enforcement via middleware
    - label: Email change confirmation
      detail: "Three modes: immediate, confirm new address, confirm both old and new"
    - label: REST API
      detail: Optional JSON API for user CRUD
    - label: Bot Protection
      detail: Google reCAPTCHA v2/v3 for registration and login forms
    - label: i18n
      detail: Built-in translations for multiple languages
    - label: Themed views
      detail: Bootstrap 5 views shipped by default; mail templates separate and independently overridable
    - label: Toast notifications
      detail: Native Bootstrap toast support with automatic fallback to flash messages

yii-bootstrap-icons:
  name: Yii / Bootstrap / Icons
  tagline: Bootstrap Icons asset bundle
  tint: "#eafff2"
  logo: /assets/icons/bootstrap.svg
  package: yiirocks/yii-bootstrap-icons
  repo: yii-bootstrap-icons
  branch: main
  workflow: build.yml
  description: >
    Provides the asset bundle to use Bootstrap Icons in your project. All
    valid icons can be found on the Bootstrap Icons page.
  usage: |-
    $assetManager->register(
        \YiiRocks\Yii\Bootstrap\Icons\Assets\BootstrapIconsAsset::class,
    );

    echo '<i class="bi-alarm"></i>';
    echo Html::i()->class('bi-alarm');

