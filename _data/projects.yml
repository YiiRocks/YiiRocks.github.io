recaptcha:
  name: reCAPTCHA
  tagline: Google reCAPTCHA v2 & v3 fields & validation
  tint: "#fff7e0"
  logo: /assets/icons/recaptcha.svg
  featured: true
  package: yiirocks/recaptcha
  repo: recaptcha
  branch: main
  workflow: build.yml
  cli: true
  docsUrl: /recaptcha/
  description: >
    Provides Google reCAPTCHA v2 and v3 field and server-side validation for
    your Yii Framework 3 applications, with various options available to
    manipulate the result.
  usage: |-
    echo RecaptchaV2Field::field($form, 'captcha')
        ->withSiteKey($siteKey);

    echo RecaptchaV3Field::field($form, 'captcha')
        ->withAction('login')
        ->withFormId('login-form');

svg-inline:
  name: SvgInline
  tagline: Inline SVG file manipulation
  tint: "#eef4ff"
  logo: /assets/icons/svg.svg
  package: yiirocks/svg-inline
  repo: svg-inline
  branch: master
  workflow: build.yml
  cli: true
  docsUrl: /svg-inline/
  description: >
    Provides simple functions for your Yii Framework 3 applications to add
    SVG files inline and manipulate their properties. Can be extended with
    Bootstrap Icons and Font Awesome Icons, with various options available
    to manipulate the result.
  usage: "$svg->file('@vendor/path/icon.svg');"
  options:
    - name: file
      type: string
      desc: Valid path to a custom file.
    - name: class
      type: string
      desc: Additional custom classes.
    - name: css
      type: array
      desc: Additional CSS attributes.
    - name: fill
      type: string
      desc: Color of the icon.
    - name: height
      type: int
      desc: >-
        The height of the icon. If height is given without width, the
        latter will be calculated from the SVG size.
    - name: id
      type: string
      desc: Id for the SVG tag.
    - name: title
      type: string
      desc: Sets a title to the SVG output.
    - name: width
      type: int
      desc: >-
        The width of the icon. If width is given without height, the
        latter will be calculated from the SVG size.
  exampleHeading: Example
  examples:
    - "echo $svg->file('@vendor/path/icon.svg')->height(42)->title('Yii Rocks');"

svg-inline-bootstrap:
  name: SvgInline / Bootstrap
  tagline: Bootstrap Icons inline
  tint: "#f3edff"
  logo: /assets/icons/bootstrap.svg
  package: yiirocks/svg-inline-bootstrap
  repo: svg-inline-bootstrap
  branch: master
  workflow: build.yml
  docsUrl: /svg-inline/bootstrap/
  description: >
    Provides simple functions for your Yii Framework 3 applications to add
    Bootstrap Icons inline. Depends on SvgInline, with various options
    available to manipulate the result.
  usage: "$svg->bootstrap($iconName);"
  options:
    - name: bootstrap
      type: string
      desc: Valid name of a Bootstrap Icon.
    - name: fixedWidth
      type: bool
      desc: Set to true to have a fixed width icon.
  inheritedFrom: svg-inline
  exampleHeading: Example
  examples:
    - "echo $svg->bootstrap('alarm')->title('Wake Up');"

svg-inline-fontawesome:
  name: SvgInline / FontAwesome
  tagline: Font Awesome Icons inline
  tint: "#fff1ee"
  logo: /assets/icons/fontawesome.svg
  package: yiirocks/svg-inline-fontawesome
  repo: svg-inline-fontawesome
  branch: master
  workflow: build.yml
  docsUrl: /svg-inline/fontawesome/
  description: >
    Provides simple functions for your Yii Framework 3 applications to add
    Font Awesome Icons inline. Depends on SvgInline, with various options
    available to manipulate the result.
  usage: |-
    $svg->fai($iconName);
    $svg->fai($iconName, $iconStyle);
  options:
    - name: fai
      type: "string [, string]"
      desc: Valid name and style (optional) of a Font Awesome Icon.
    - name: fixedWidth
      type: bool
      desc: Set to true to have a fixed width icon.
  inheritedFrom: svg-inline
  exampleHeading: Examples
  examples:
    - "echo $svg->fai('hands-wash')->title('Wash your hands');"
    - "echo $svg->fai('github', 'brands')->title('GitHub');"

voyti:
  name: Voyti
  tagline: User management, authentication & authorization
  tint: "#eef4ff"
  logo: /assets/icons/voyti.svg
  featured: true
  package: yiirocks/voyti
  repo: voyti
  branch: main
  workflow: build.yml
  cli: true
  docsUrl: /voyti/
  description: >
    Provides highly customizable user management, authentication, and
    authorization for your Yii Framework 3 applications.
  features:
    - label: User management
      detail: Registration, email confirmation, login/logout with remember-me, password recovery, password expiration
    - label: Profile management
      detail: User profiles with gravatar, timezone, bio, and a personal website link
    - label: Identity switching
      detail: Admins can temporarily switch into another user's identity for support or debugging, then restore their own session with one click
    - label: RBAC
      detail: Full admin UI for roles, permissions, and rules with parent-child hierarchy, assignment management, and filtering
    - label: Social authentication
      detail: Various built-in auth clients
    - label: Two-factor authentication
      detail: TOTP (authenticator app) and email 2FA with enforced-per-permission support, plus one-time backup codes for account recovery
    - label: Password policies
      detail: Minimum complexity requirements, max age enforcement via middleware
    - label: Email change confirmation
      detail: Three modes: immediate, confirm new address, confirm both old and new
    - label: GDPR compliance
      detail: Consent management, data export, anonymized deletion with admin notification
    - label: Session management
      detail: Session tracking and termination
    - label: REST API
      detail: Optional JSON API for user CRUD
    - label: reCAPTCHA
      detail: Optional reCAPTCHA v2/v3 integration via yiirocks/recaptcha
    - label: i18n
      detail: Built-in translations for multiple languages
    - label: Themed views
      detail: Bootstrap 5 views shipped by default; mail templates separate and independently overridable

yii-bootstrap-icons:
  name: Yii / Bootstrap / Icons
  tagline: Bootstrap Icons asset bundle
  tint: "#eafff2"
  logo: /assets/icons/bootstrap.svg
  package: yiirocks/yii-bootstrap-icons
  repo: yii-bootstrap-icons
  branch: main
  workflow: build.yml
  description: >
    Provides the asset bundle to use Bootstrap Icons in your project. All
    valid icons can be found on the Bootstrap Icons page.
  usage: |-
    $assetManager->register(
        \YiiRocks\Yii\Bootstrap\Icons\Assets\BootstrapIconsAsset::class,
    );

    echo '<i class="bi-alarm"></i>';
    echo Html::i()->class('bi-alarm');

yii2-fontawesome-inline:
  name: Yii2 / FontAwesome / inline
  tagline: Font Awesome inline for Yii2
  tint: "#fff1ee"
  logo: /assets/icons/fontawesome.svg
  package: thoulah/yii2-fontawesome-inline
  repo: yii2-fontawesome-inline
  branch: master
  travis: true
  docsUrl: /yii2-fontawesome-inline/
  description: >
    Provides simple functions for your Yii Framework 2.0 applications to add
    Font Awesome Icons inline, with various options available to manipulate
    the result.
  usage: |-
    $icon = new \thoulah\fontawesome\Icon();
    echo $icon->show('github', ['style' => 'brands', 'fill' => '#003865']);
