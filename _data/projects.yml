  package: thoulah/yii2-fontawesome-inline
  repo: yii2-fontawesome-inline
  travis: true
  codacy: 77359b0ae813411895da7d33bb009bf0
  head_id: headYii2FontAwesome
  collapse_id: cardYii2FontAwesome
  body: |
    <p>
        <a href="https://github.com/YiiRocks/yii2-fontawesome-inline"
        class="text-nowrap">yii2-fontawesome-inline</a> provides
        simple functions for your <a href="http://www.yiiframework.com/"
        class="text-nowrap">Yii Framework 2.0</a> applications to add
